apiVersion: ax.io/v1alpha1
kind: Workspace
metadata:
  name: exp001-research-workspace
  atespace: default
spec:
  git:
    - url: "https://github.com/google/ax.git"
      branch: "main"
      mountPath: "/workspace/source/ax"
  mcp:
    servers:
      - name: "research-tools"
        url: "http://172.18.0.1:8085/mcp"
        transport: "sse"
  skills:
    repositories:
      - name: "research-skills"
        url: "local://skills/research"
