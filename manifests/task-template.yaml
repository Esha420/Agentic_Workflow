apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: ${TASK_NAME}
  atespace: ${ATESPACE:-default}
  labels:
    agent-lab.io/session-id: "${SESSION_ID}"
    agent-lab.io/role: "research"
    agent-lab.io/phase: "phase-1"
spec:
  image: "localhost:5001/openclaw-agent@sha256:3a00eb8df2f127b46e926dcea420ade1d46f8723b0ec7abb4b3610637569f7d9"
  command:
    - /bin/bash
    - /agent/run_workload.sh
  env:
    - name: ROLE
      value: "research"
    - name: TARGET
      value: "${RESEARCH_TARGET:-Autonomous Actor Checkpointing & State Persistence}"
    - name: SCAN_API_URL
      value: "${SCAN_API_URL:-http://mock-scan-api.default.svc.cluster.local:8080}"
    - name: MCP_URL
      value: "${MCP_URL:-http://172.18.0.1:8085/mcp}"
    - name: TASK_NAME
      value: "${TASK_NAME}"
    - name: WORKSPACE
      value: "/workspace"
    - name: SESSION_ID
      value: "${SESSION_ID}"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://opentelemetry-collector.otel-system.svc.cluster.local:4318"
    - name: OTEL_SERVICE_NAME
      value: "agent-lab-researcher"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "http/protobuf"
  debug: true
